<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 20 ฐาน ปริศนาศาสตร์พระราชา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root { --ink:#1b1b1b; --muted:#666; --accent:#a8741a; --line:#d9c9a3; }
  * { box-sizing: border-box; }
  body { margin:0; background:#eee; color:var(--ink); font-family:'Sarabun',sans-serif; }
  .toolbar { position:sticky; top:0; background:#fff; padding:12px 16px; border-bottom:1px solid #ddd; display:flex; gap:10px; align-items:center; flex-wrap:wrap; z-index:5; }
  .toolbar button { font:inherit; font-weight:700; padding:8px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  .toolbar input[type=text] { font:inherit; padding:6px 10px; width:min(460px,100%); border:1px solid #ccc; border-radius:6px; }
  .sheet { width:210mm; min-height:297mm; margin:12px auto; background:#fff; padding:10mm; display:grid; grid-template-rows:1fr 1fr; gap:10mm; page-break-after:always; }
  .card { border:3px dashed var(--line); border-radius:6mm; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6mm; text-align:center; }
  .tag { font-size:16pt; color:var(--muted); letter-spacing:1px; }
  .num { font-size:54pt; font-weight:800; color:var(--accent); line-height:1; margin:2mm 0 4mm; }
  .qr svg { width:80mm; height:80mm; display:block; }
  .hint { margin-top:4mm; font-size:14pt; }
  .url { margin-top:2mm; font-size:9pt; color:#999; word-break:break-all; }
  .sheet.one { grid-template-rows:1fr; }
  .one .card { border-width:4px; }
  .one .tag { font-size:24pt; }
  .one .num { font-size:110pt; margin:2mm 0 6mm; }
  .one .qr svg { width:150mm; height:150mm; }
  .one .hint { margin-top:6mm; font-size:20pt; }
  .one .url { font-size:11pt; }
  @media print {
    body { background:#fff; }
    .toolbar { display:none; }
    .sheet { margin:0; width:auto; min-height:auto; height:277mm; padding:0; }
    @page { size:A4; margin:10mm; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <label>ที่อยู่เว็บ: <input type="text" id="base"></label>
  <label>ขนาด: <select id="per"><option value="1">หน้าละ 1 ฐาน (QR ใหญ่)</option><option value="2">หน้าละ 2 ฐาน</option></select></label>
  <button onclick="window.print()">🖨️ พิมพ์ A4</button>
</div>
<div id="out"></div>
<script>
const DEFAULT_BASE = 'https://rpg60tanakon-source.github.io/riddle-r60/';
const baseInput = document.getElementById('base');
let saved = null;
try { saved = localStorage.getItem('riddleBase'); } catch (e) {}
baseInput.value = saved || DEFAULT_BASE;

function qrSvg(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}

function render() {
  let base = baseInput.value.trim();
  if (!base.endsWith('/')) base += '/';
  try { localStorage.setItem('riddleBase', baseInput.value.trim()); } catch (e) {}
  const out = document.getElementById('out');
  out.innerHTML = '';
  const per = +document.getElementById('per').value;
  let sheet;
  for (let n = 1; n <= 20; n++) {
    if ((n - 1) % per === 0) { sheet = document.createElement('section'); sheet.className = per === 1 ? 'sheet one' : 'sheet'; out.appendChild(sheet); }
    const url = base + '?n=' + n;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="tag">ปริศนาศาสตร์พระราชา · ฐานที่</div>
      <div class="num">${n}</div>
      <div class="qr">${qrSvg(url)}</div>
      <div class="hint">📱 สแกนอ่านปริศนา แล้ว<b>เลือกคำตอบในมือถือได้เลย</b></div>
      <div class="url">${url}</div>`;
    sheet.appendChild(card);
  }
}
baseInput.addEventListener('input', render);
document.getElementById('per').addEventListener('change', render);
render();
</script>
</body>
</html>
