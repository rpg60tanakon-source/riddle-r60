<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตารางคะแนน ปริศนาศาสตร์พระราชา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Sarabun',sans-serif; color:#2b2112;
         background:linear-gradient(160deg,#fff7e0,#f3dca4); padding:24px 16px 40px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { text-align:center; margin:0; font-size:clamp(26px,5vw,44px); color:#8a5a12; }
  .sub { text-align:center; color:#8a6a2e; margin:4px 0 22px; font-size:16px; }
  .row { display:grid; grid-template-columns:64px 1fr 150px; align-items:center; gap:12px; background:#fff; border-radius:16px;
         padding:12px 18px; margin-bottom:10px; box-shadow:0 4px 14px rgba(120,80,10,.12); font-size:clamp(18px,3vw,26px); }
  .rank { font-size:1.4em; font-weight:800; text-align:center; color:#a08850; }
  .row.r1 { border:3px solid #e0b43c; } .row.r1 .rank { color:#d4a017; }
  .row.r2 .rank { color:#8c99a6; } .row.r3 .rank { color:#b87333; }
  .name { font-weight:700; overflow-wrap:anywhere; }
  .time { font-size:.6em; color:#999; font-weight:400; }
  .pts { text-align:right; font-weight:800; color:#2f8a4a; font-size:1.3em; }
  .pts small { font-size:.5em; color:#999; }
  .bar { grid-column:1/-1; height:8px; background:#f1e6cc; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#2f8a4a; }
  .empty { text-align:center; font-size:20px; color:#8a6a2e; padding:40px 0; }
  .del { display:none; font:inherit; font-size:15px; font-weight:700; margin-top:4px; padding:4px 12px; border:0; border-radius:8px;
         background:#fde3e1; color:#b3261e; cursor:pointer; }
  body.admin .del { display:inline-block; }
  .adminbar { margin-top:24px; text-align:center; }
  .adminbar button { font:inherit; font-size:15px; padding:8px 16px; border-radius:10px; border:1px solid #d9c9a3; background:#fff; color:#8a6a2e; cursor:pointer; margin:4px; }
  .adminbar .danger { background:#b3261e; color:#fff; border:0; font-weight:700; }
  .only-admin { display:none; } body.admin .only-admin { display:inline-block; } body.admin .only-guest { display:none; }
  @media (max-width:520px) { .row { grid-template-columns:34px minmax(0,1fr) 72px; gap:8px; padding:10px 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 ตารางคะแนน ปริศนาศาสตร์พระราชา</h1>
  <div class="sub" id="sub">กำลังโหลด...</div>
  <div id="list"></div>
  <div class="adminbar">
    <button class="only-guest" id="login">🔒 โหมดครู (ลบคะแนน)</button>
    <button class="only-admin danger" id="clear">🗑 ลบคะแนนทั้งหมด</button>
    <button class="only-admin" id="logout">ออกจากโหมดครู</button>
  </div>
</div>
<script src="riddles.js?v=3"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const medal = ['🥇','🥈','🥉'];
async function load() {
  const sub = document.getElementById('sub'), box = document.getElementById('list');
  if (!API_URL) { sub.textContent = 'ครูยังไม่ได้ตั้งค่า API_URL ในไฟล์ riddles.js'; return; }
  try {
    const data = await (await fetch(API_URL + '?t=' + Date.now())).json();
    const list = data.list.sort((a, b) => b.score - a.score || a.time - b.time);
    sub.textContent = `ส่งแล้ว ${list.length} กลุ่ม · อัปเดตอัตโนมัติทุก 10 วินาที`;
    if (!list.length) { box.innerHTML = '<div class="empty">ยังไม่มีกลุ่มส่งคำตอบ</div>'; return; }
    box.innerHTML = list.map((g, i) => {
      const t = new Date(g.time).toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      return `<div class="row r${i + 1}"><div class="rank">${medal[i] || i + 1}</div>
        <div class="name">${esc(g.group)}<div class="time">ส่งเมื่อ ${t}</div>
          <button class="del" data-time="${g.time}" data-group="${esc(g.group)}">🗑 ลบ</button></div>
        <div class="pts">${g.score}<small> / ${data.total}</small></div>
        <div class="bar"><i style="width:${g.score / data.total * 100}%"></i></div></div>`;
    }).join('');
  } catch (e) { sub.textContent = 'โหลดคะแนนไม่สำเร็จ จะลองใหม่อัตโนมัติ'; }
}
// ===== โหมดครู: ลบคะแนน (ตรวจรหัสที่ Apps Script) =====
let adminPw = null;
try { adminPw = sessionStorage.getItem('r60riddle.pw'); } catch (e) {}
const setAdmin = pw => {
  adminPw = pw;
  try { pw ? sessionStorage.setItem('r60riddle.pw', pw) : sessionStorage.removeItem('r60riddle.pw'); } catch (e) {}
  document.body.classList.toggle('admin', !!pw);
};
setAdmin(adminPw);

async function adminCall(payload) {
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                                     body: JSON.stringify(Object.assign({ password: adminPw }, payload)) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'ไม่สำเร็จ');
  return data;
}

document.getElementById('login').onclick = async () => {
  const pw = prompt('ใส่รหัสครู');
  if (!pw) return;
  adminPw = pw;
  try { await adminCall({ action:'login' }); setAdmin(pw); }
  catch (e) { adminPw = null; alert(e.message); }
};
document.getElementById('logout').onclick = () => setAdmin(null);
document.getElementById('clear').onclick = async () => {
  if (!confirm('ลบคะแนนทุกกลุ่ม? กู้คืนไม่ได้')) return;
  if (prompt('พิมพ์คำว่า ลบทั้งหมด เพื่อยืนยัน') !== 'ลบทั้งหมด') return;
  try { await adminCall({ action:'clear' }); load(); } catch (e) { alert(e.message); }
};
document.getElementById('list').addEventListener('click', async ev => {
  const b = ev.target.closest('.del');
  if (!b) return;
  if (!confirm(`ลบคะแนนของกลุ่ม "${b.dataset.group}"? กู้คืนไม่ได้`)) return;
  b.disabled = true; b.textContent = 'กำลังลบ...';
  try { await adminCall({ action:'delete', time: b.dataset.time, group: b.dataset.group }); load(); }
  catch (e) { alert(e.message); b.disabled = false; b.textContent = '🗑 ลบ'; }
});

load(); setInterval(load, 10000);
</script>
</body>
</html>
